version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file:
      - .env
    ports:
      - "8000:8000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./:/app

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./:/app

  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A app.celery_app beat --loglevel=info
    env_file:
      - .env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./:/app
