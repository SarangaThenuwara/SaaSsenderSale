{% extends "premium/base.html" %}
{% block content %}
<section class="flex items-center justify-center min-h-[80vh] px-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h2 class="text-4xl font-bold text-white mb-2">Welcome back</h2>
            <p class="text-slate-400">Sign in to your account</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-200 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="post" class="space-y-4">
            <input type="hidden" name="csrf" value="{{ csrf_token }}">
            <div>
                <input name="email" type="email" required class="input-glass px-4 py-3" placeholder="Email" />
            </div>
            <div>
                <input name="password" type="password" required class="input-glass px-4 py-3" placeholder="Password" />
                <div class="text-right mt-2">
                    <a href="/forgot-password"
                        class="text-sm text-slate-400 hover:text-primary-400 transition-colors">Forgot password?</a>
                </div>
            </div>
            <button class="btn-primary w-full py-4 text-base font-bold">Sign in</button>
        </form>

        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-white/10"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-4 bg-slate-900 text-slate-400">Or continue with</span>
            </div>
        </div>

        <a href="/login/google"
            class="btn-secondary w-full py-4 text-base font-bold flex items-center justify-center gap-3">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="currentColor"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                <path fill="currentColor"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                <path fill="currentColor"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                <path fill="currentColor"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
            </svg>
            Continue with Google
        </a>

        <div class="mt-6 text-center text-sm text-slate-400">
            Don't have an account? <a href="/signup" class="text-primary-400 hover:text-white font-bold">Sign up</a>
        </div>
    </div>
</section>
{% endblock %}
