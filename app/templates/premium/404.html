{% extends "premium/base.html" %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4">
    <div class="max-w-2xl w-full text-center animate-fade-in">

        <!-- Glitch Error Code -->
        <div class="relative inline-block mb-8">
            <div class="text-[9rem] md:text-[12rem] font-black leading-none select-none" style="
                background: linear-gradient(135deg, rgba(139,92,246,0.15) 0%, rgba(59,130,246,0.08) 100%);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                text-shadow: 0 0 80px rgba(139,92,246,0.2);
                font-family: 'Lexend', sans-serif;
            ">404</div>
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="h-px w-full bg-gradient-to-r from-transparent via-primary-500/40 to-transparent"></div>
            </div>
        </div>

        <!-- Icon -->
        <div class="flex justify-center mb-8">
            <div
                class="h-20 w-20 rounded-3xl bg-primary-500/10 border border-primary-500/20 flex items-center justify-center shadow-2xl shadow-primary-500/10">
                <svg class="w-10 h-10 text-primary-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
        </div>

        <h1 class="text-3xl md:text-4xl font-black text-white mb-4 tracking-tight">Page Not Found</h1>
        <p class="text-slate-400 text-lg mb-10 max-w-md mx-auto leading-relaxed">
            This route doesn't exist in our system. It may have been moved, deleted, or the URL might be mistyped.
        </p>

        <!-- Navigation Options -->
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-10">
            <a href="/"
                class="group flex flex-col items-center gap-2 p-5 bg-white/5 hover:bg-white/10 border border-white/5 hover:border-primary-500/30 rounded-2xl transition-all duration-200">
                <svg class="w-5 h-5 text-slate-400 group-hover:text-primary-400 transition-colors" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span class="text-xs font-bold text-slate-400 group-hover:text-white transition-colors">Home</span>
            </a>
            <a href="/resources"
                class="group flex flex-col items-center gap-2 p-5 bg-white/5 hover:bg-white/10 border border-white/5 hover:border-primary-500/30 rounded-2xl transition-all duration-200">
                <svg class="w-5 h-5 text-slate-400 group-hover:text-primary-400 transition-colors" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
                <span class="text-xs font-bold text-slate-400 group-hover:text-white transition-colors">Knowledge
                    Hub</span>
            </a>
            <a href="/login"
                class="group flex flex-col items-center gap-2 p-5 bg-white/5 hover:bg-white/10 border border-white/5 hover:border-primary-500/30 rounded-2xl transition-all duration-200 col-span-2 md:col-span-1">
                <svg class="w-5 h-5 text-slate-400 group-hover:text-primary-400 transition-colors" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                </svg>
                <span class="text-xs font-bold text-slate-400 group-hover:text-white transition-colors">Sign In</span>
            </a>
        </div>

        <button onclick="history.back()"
            class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-white transition-colors group">
            <svg class="w-4 h-4 transition-transform group-hover:-translate-x-1" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16l-4-4m0 0l4-4m-4 4h18" />
            </svg>
            Go back to previous page
        </button>

        <!-- Error Code Footer -->
        <p class="mt-12 text-[10px] font-mono text-slate-700 uppercase tracking-widest">
            ERR_ROUTE_NOT_FOUND · HTTP/1.1 404
        </p>
    </div>
</div>
{% endblock %}
