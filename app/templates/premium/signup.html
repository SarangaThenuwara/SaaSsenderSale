{% extends "premium/base.html" %}
{% block content %}
<section class="relative flex items-center justify-center min-h-screen px-4 -mt-16 pt-16">

  <!-- Ambient glows -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute left-1/2 top-1/3 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-primary-600/10 rounded-full blur-[120px]"></div>
    <div class="absolute left-1/4 bottom-1/4 w-[280px] h-[280px] bg-accent-600/8 rounded-full blur-[90px]"></div>
  </div>

  <div class="w-full max-w-md relative z-10">

    <div class="rounded-2xl overflow-hidden shadow-2xl shadow-slate-950/80">
      <!-- Gradient top accent -->
      <div class="h-[3px] bg-gradient-to-r from-accent-400 via-primary-400 to-violet-400"></div>

      <div class="bg-slate-900/80 backdrop-blur-xl border border-white/8 border-t-0 rounded-b-2xl p-8 md:p-10">

        <!-- Header -->
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-accent-500/15 border border-accent-500/20 mb-4 shadow-lg shadow-accent-900/30">
            <svg class="w-7 h-7 text-accent-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
            </svg>
          </div>
          <h1 class="text-2xl font-bold text-white font-display tracking-tight">Create account</h1>
          <p class="text-slate-400 text-sm mt-1">Start sending tailored applications</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/25 text-red-300 text-xs flex items-start gap-3">
          <svg class="w-4 h-4 mt-0.5 shrink-0 text-red-400" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>
          <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/signup" method="post" class="space-y-5" autocomplete="on">
          <input type="hidden" name="csrf" value="{{ csrf_token }}">

          <!-- Email -->
          <div class="space-y-1.5">
            <label for="signup-email" class="text-[10px] uppercase font-bold text-slate-500 tracking-widest ml-0.5">Email Address</label>
            <input
              id="signup-email"
              name="email"
              type="email"
              required
              autofocus
              autocomplete="email"
              class="input-glass rounded-xl px-4 py-3.5 text-sm w-full outline-none transition-all duration-200
                     focus:ring-2 focus:ring-primary-500/60 focus:border-primary-500/50
                     placeholder:text-slate-600"
              placeholder="name@domain.com"
            />
          </div>

          <!-- Password with strength + toggle -->
          <div class="space-y-1.5">
            <label for="signup-password" class="text-[10px] uppercase font-bold text-slate-500 tracking-widest ml-0.5">Password</label>
            <div class="relative">
              <input
                id="signup-password"
                name="password"
                type="password"
                required
                autocomplete="new-password"
                minlength="8"
                class="input-glass rounded-xl px-4 py-3.5 pr-12 text-sm w-full outline-none transition-all duration-200
                       focus:ring-2 focus:ring-primary-500/60 focus:border-primary-500/50
                       placeholder:text-slate-600"
                placeholder="Min 8 characters"
              />
              <button
                type="button"
                id="signup-toggle-password"
                aria-label="Toggle password visibility"
                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors focus:outline-none"
              >
                <svg id="su-eye-open" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
                <svg id="su-eye-closed" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                </svg>
              </button>
            </div>
            <!-- Password strength bar -->
            <div class="flex gap-1 mt-2" id="strength-bars">
              <div class="h-1 flex-1 rounded-full bg-white/8" id="sb1"></div>
              <div class="h-1 flex-1 rounded-full bg-white/8" id="sb2"></div>
              <div class="h-1 flex-1 rounded-full bg-white/8" id="sb3"></div>
              <div class="h-1 flex-1 rounded-full bg-white/8" id="sb4"></div>
            </div>
            <p id="strength-label" class="text-[10px] text-slate-600 ml-0.5"></p>
          </div>

          <button
            type="submit"
            class="btn-primary w-full py-4 rounded-xl text-sm font-bold mt-1 shadow-xl shadow-primary-500/25 flex items-center justify-center gap-2 group"
          >
            <span>Create Account</span>
            <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
            </svg>
          </button>
        </form>

        <!-- Divider -->
        <div class="relative my-8">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-white/6"></div>
          </div>
          <div class="relative flex justify-center">
            <span class="px-4 bg-slate-900/90 text-[10px] uppercase tracking-[0.18em] font-bold text-slate-600">Secure SSO</span>
          </div>
        </div>

        <!-- Google SSO -->
        <a
          href="/login/google"
          class="w-full py-3.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-3 transition-all duration-200
                 bg-white/5 hover:bg-white/10 border border-white/10 hover:border-white/20
                 text-slate-200 hover:text-white hover:scale-[1.015] hover:shadow-lg hover:shadow-slate-950/40"
        >
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </a>

        <p class="mt-7 text-center text-xs text-slate-500">
          Already have an account?
          <a href="/login" class="text-primary-400 hover:text-primary-300 font-bold underline underline-offset-4 decoration-primary-400/30 transition-colors ml-1">Sign in</a>
        </p>

      </div>
    </div>

    <!-- Reassurance row -->
    <div class="flex items-center justify-center gap-2 mt-5 text-[11px] text-slate-600">
      <svg class="w-3.5 h-3.5 text-emerald-500/70" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
      </svg>
      <span>Free forever · No credit card needed · Cancel anytime</span>
    </div>

  </div>
</section>

<script nonce="{{ csp_nonce }}">
  (function () {
    // Password visibility toggle
    const btn = document.getElementById('signup-toggle-password');
    const input = document.getElementById('signup-password');
    const eyeOpen = document.getElementById('su-eye-open');
    const eyeClosed = document.getElementById('su-eye-closed');
    if (btn && input) {
      btn.addEventListener('click', function () {
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        eyeOpen.classList.toggle('hidden', isPassword);
        eyeClosed.classList.toggle('hidden', !isPassword);
      });
    }

    // Password strength indicator
    const bars = [
      document.getElementById('sb1'),
      document.getElementById('sb2'),
      document.getElementById('sb3'),
      document.getElementById('sb4'),
    ];
    const label = document.getElementById('strength-label');
    const LEVELS = [
      { color: 'bg-red-500',    text: 'Weak' },
      { color: 'bg-amber-500',  text: 'Fair' },
      { color: 'bg-yellow-400', text: 'Good' },
      { color: 'bg-emerald-500',text: 'Strong' },
    ];

    function getStrength(pwd) {
      let score = 0;
      if (pwd.length >= 8)  score++;
      if (pwd.length >= 12) score++;
      if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
      if (/\d/.test(pwd) && /[^A-Za-z0-9]/.test(pwd)) score++;
      return Math.min(score, 4);
    }

    if (input && label) {
      input.addEventListener('input', function () {
        const strength = getStrength(this.value);
        bars.forEach((bar, i) => {
          bar.className = 'h-1 flex-1 rounded-full transition-all duration-300 ';
          bar.className += i < strength ? LEVELS[strength - 1].color : 'bg-white/8';
        });
        label.textContent = this.value.length === 0 ? '' : (LEVELS[strength - 1]?.text || '');
      });
    }
  })();
</script>
{% endblock %}
