{% extends "premium/base.html" %}
{% block content %}
<section class="flex items-center justify-center min-h-[80vh] px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h2 class="text-4xl font-bold text-white mb-2">Create account</h2>
      <p class="text-slate-400">Start sending tailored applications</p>
    </div>

    {% if error %}
    <div class="mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-200 text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form action="/signup" method="post" class="space-y-4">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <div>
        <input name="email" type="email" required class="input-glass px-4 py-3" placeholder="Email" />
      </div>
      <div>
        <input name="password" type="password" required class="input-glass px-4 py-3"
          placeholder="Password (min 8 characters)" />
      </div>
      <button class="btn-primary w-full py-4 text-base font-bold">Create account</button>
    </form>

    <div class="mt-6 text-center text-sm text-slate-400">
      Already have an account? <a href="/login" class="text-primary-400 hover:text-white font-bold">Sign in</a>
    </div>
  </div>
</section>
{% endblock %}
