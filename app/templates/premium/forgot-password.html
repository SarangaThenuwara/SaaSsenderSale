{% extends "premium/base.html" %}
{% block content %}
<section class="flex items-center justify-center min-h-[80vh] px-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h2 class="text-4xl font-bold text-white mb-2">Reset password</h2>
            <p class="text-slate-400">Enter your email to receive a reset link</p>
        </div>

        {% if success %}
        <div class="mb-6 p-4 rounded-xl bg-green-500/10 border border-green-500/20 text-green-200 text-sm">
            Check your email for password reset instructions.
        </div>
        {% endif %}

        {% if error %}
        <div class="mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-200 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form action="/forgot-password" method="post" class="space-y-4">
            <input type="hidden" name="csrf" value="{{ csrf_token }}">
            <div>
                <input name="email" type="email" required class="input-glass px-4 py-3" placeholder="Email" />
            </div>
            <button class="btn-primary w-full py-4 text-base font-bold">Send reset link</button>
        </form>

        <div class="mt-6 text-center text-sm text-slate-400">
            Remember your password? <a href="/login" class="text-primary-400 hover:text-white font-bold">Sign in</a>
        </div>
    </div>
</section>
{% endblock %}
