{% extends "premium/base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-12 animate-fade-in">
    <div class="card-glass p-8 space-y-8">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold font-display text-white">Admin Access</h1>
            <p class="text-slate-400">Enter your administrative credentials.</p>
        </div>

        {% if error %}
        <div class="p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-200 text-sm flex items-center gap-3">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            {{ error }}
        </div>
        {% endif %}

        <form action="/admin-login" method="post" class="space-y-6">
            <input type="hidden" name="csrf" value="{{ csrf_token }}">

            <div class="space-y-2">
                <label class="block text-sm font-medium text-slate-300">Username</label>
                <div class="relative group">
                    <input type="text" name="username" required
                        class="input-glass w-full px-4 py-3 bg-slate-800/50 border-white/5 focus:border-primary-500/50"
                        placeholder="admin">
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-medium text-slate-300">Password</label>
                <div class="relative group">
                    <input type="password" name="password" required
                        class="input-glass w-full px-4 py-3 bg-slate-800/50 border-white/5 focus:border-primary-500/50"
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit"
                class="btn-primary w-full py-3 rounded-xl font-bold text-white shadow-lg shadow-primary-500/20 hover:shadow-primary-500/40 transition-all">
                Sign In to Dashboard
            </button>
        </form>

        <div class="text-center pt-4">
            <a href="/login" class="text-xs text-slate-500 hover:text-primary-400 transition-colors">Standard User
                Login</a>
        </div>
    </div>
</div>
{% endblock %}
