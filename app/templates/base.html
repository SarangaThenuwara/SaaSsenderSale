<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>SaaS Sender</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">

  <!-- PWA & Icons -->
  <link rel="icon" type="image/svg+xml" href="/static/img/icon.svg">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3b82f6">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js').catch(err => console.log('SW error:', err));
      });
    }
  </script>

</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="/">SaaS Email Sender</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="/signup">Sign Up</a></li>
          <!-- Admin login intentionally not linked here; use /admin-login if needed -->
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    {% block content %}{% endblock %}
  </div>

  <footer class="text-center text-muted py-3">
    <small>Prototype — secure secrets before production.</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
